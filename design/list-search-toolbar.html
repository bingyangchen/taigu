<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>歷史紀錄與買賣計畫的搜尋框｜Taigu 設計稿</title>
    <link rel="stylesheet" href="shared/components.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: linear-gradient(
          180deg,
          var(--color-bg-shell-top) 0%,
          var(--color-bg-shell-bottom) 100%
        );
        color: var(--color-text-primary);
        font-variant-numeric: tabular-nums;
      }

      ::selection {
        background: var(--color-bg-accent-subtle);
      }

      .shell {
        display: flex;
        height: 100dvh;
      }

      /* Stand-in for MainSideBar; only its width matters to this draft. */
      .sidebar {
        flex: 0 0 var(--layout-sidebar-width);
        display: flex;
        flex-direction: column;
        gap: var(--space-050);
        padding: var(--space-200) var(--space-100);
        background: var(--color-bg-surface);
        border-right: 1px solid var(--color-border-subtle);
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
      }

      .sidebar span {
        padding: var(--space-150) var(--space-150);
        border-radius: var(--radius-lg);
      }

      .sidebar span[aria-current] {
        background: var(--color-bg-accent-subtle);
        color: var(--color-text-accent-strong);
      }

      .content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 0 var(--space-200) var(--space-150);
      }

      /* The search field: the same look as the Market page's search box. */
      .search_field {
        display: flex;
        align-items: center;
        gap: var(--space-100);
        width: 280px;
        height: 40px;
        padding: 0 var(--space-150);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-pill);
        background: var(--color-bg-surface);
        color: var(--color-text-secondary);
      }

      /* The focus ring of the Market page's search box (ds.focus-ring). */
      .search_field:focus-within {
        outline: var(--focus-ring-width) solid var(--color-focus-ring);
        outline-offset: var(--focus-ring-offset);
      }

      .search_field svg {
        flex: none;
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .search_field input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--color-text-primary);
        font: inherit;
        font-size: var(--font-size-sm);
      }

      .search_field input::placeholder {
        color: var(--color-text-tertiary);
      }

      .list_card {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-radius: var(--radius-2xl);
        background: var(--color-bg-frosted);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }

      .list_scroll {
        overflow: auto;
        padding-bottom: var(--space-300);
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto 96px;
        align-items: center;
        column-gap: var(--space-300);
        padding: var(--space-200) var(--space-250);
        border-bottom: 1px solid var(--color-border-subtle);
        font-size: var(--font-size-sm);
      }

      .row:hover {
        background: var(--color-bg-hover);
      }

      .identity {
        display: flex;
        flex-direction: column;
        gap: var(--space-075);
        min-width: 0;
      }

      .company {
        display: flex;
        align-items: baseline;
        gap: var(--space-100);
        font-weight: var(--font-weight-bold);
      }

      .sid {
        font-size: var(--font-size-md);
      }

      .date {
        color: var(--color-text-tertiary);
        font-size: var(--font-size-xs);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        height: 26px;
        padding: 0 var(--space-100);
        border-radius: var(--radius-md);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-bold);
      }

      .badge.buy {
        color: var(--color-text-danger);
        background: var(--color-bg-danger-subtle);
      }

      .badge.sell {
        color: var(--color-text-accent-strong);
        background: var(--color-bg-accent-subtle);
      }

      .badge.dividend {
        color: var(--color-text-success);
        background: var(--color-bg-success-subtle);
      }

      .quantity {
        min-width: 72px;
        text-align: right;
        font-weight: var(--font-weight-bold);
      }

      .price {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: var(--space-025);
      }

      .price small {
        color: var(--color-text-tertiary);
        font-size: var(--font-size-2xs);
      }

      .price strong {
        font-size: var(--font-size-md);
      }

      .empty {
        padding: var(--space-800) var(--space-250);
        color: var(--color-text-secondary);
        font-size: var(--font-size-sm);
        text-align: center;
      }

      /* Current: a short floating pill centred above the card. */
      [data-variant="current"] .toolbar {
        align-self: center;
        margin: var(--space-200) 0;
        padding: var(--space-100) var(--space-050);
        border: 0.5px solid var(--color-border-subtle);
        border-radius: var(--radius-pill);
        background: var(--color-bg-frosted);
        box-shadow: var(--shadow-md);
      }

      [data-variant="current"] .search_field {
        width: auto;
        height: 24px;
        border: 0;
        background: transparent;
      }

      /*
       * Proposal A: the search field is the list card's own header row, so it
       * reads as the list's filter and stays in place while rows scroll.
       */
      [data-variant="a"] .content {
        padding-top: var(--space-200);
      }

      [data-variant="a"] .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-200);
        padding: var(--space-150) var(--space-250);
        border-bottom: 1px solid var(--color-border-default);
      }

      /* Proposal A: a result count on the right, shown only while a keyword filters the list. */
      .count {
        color: var(--color-text-secondary);
        font-size: var(--font-size-xs);
      }

      /* Proposal B: a toolbar row above the card, right-aligned like the Market page. */
      [data-variant="b"] .toolbar {
        display: flex;
        justify-content: flex-end;
        margin: var(--space-200) 0 var(--space-150);
      }

      /*
       * Proposal C: a toolbar row above the card, left-aligned, with less space
       * before the card. Unfocused, the field takes the segmented control's track
       * colour and no border, so it recedes until the user reaches for it.
       */
      /* The field has the same space above it as below it. */
      [data-variant="c"] .toolbar {
        display: flex;
        justify-content: flex-start;
        margin: var(--space-150) 0;
      }

      [data-variant="c"] .search_field {
        height: 48px;
        border-color: transparent;
        background: var(--color-bg-muted);
        transition:
          background-color var(--duration-fast) var(--ease-standard),
          border-color var(--duration-fast) var(--ease-standard);
      }

      /*
       * Proposal C: a keyword left in the field gives it the list card's
       * translucent background, and focus adds a border instead of the app's
       * default focus ring, so focus stays visible on a field that holds a
       * keyword. --color-border-medium is the border token this proposal adds,
       * between --color-border-default and --color-border-strong.
       */
      [data-variant="c"] .search_field:has(input:not(:placeholder-shown)) {
        background: var(--color-bg-frosted);
      }

      [data-variant="c"] .search_field:focus-within {
        outline: none;
        border-color: var(--color-border-medium);
        background: var(--color-bg-frosted);
      }

      /* The clear button: a 32px RoundButton, shown while the field holds a keyword. */
      .search_field .clear {
        flex: none;
        width: 32px;
        height: 32px;
        padding: 0;
      }

      .search_field:has(input:placeholder-shown) .clear {
        display: none;
      }

      .search_field .clear svg {
        width: 12px;
        height: 12px;
      }

      .toolbar .count {
        display: none;
      }

      [data-variant="a"][data-state="filtered"] .toolbar .count {
        display: inline;
      }

      /* Narrow layout: unchanged, the search row spans the screen above the list. */
      @media (max-width: 959px) {
        .sidebar {
          display: none;
        }

        .content {
          padding: 0;
        }

        [data-variant] .content {
          padding-top: 0;
        }

        [data-variant] .toolbar {
          display: flex;
          align-self: stretch;
          margin: var(--space-150) var(--space-200) var(--space-200);
          padding: var(--space-100) var(--space-050);
          border: 0.5px solid var(--color-border-subtle);
          border-radius: var(--radius-pill);
          background: var(--color-bg-frosted);
          box-shadow: var(--shadow-md);
        }

        [data-variant] .search_field {
          width: 100%;
          height: 28px;
          border: 0;
          background: transparent;
          box-shadow: none;
        }

        [data-variant] .toolbar .count {
          display: none;
        }

        .list_card {
          border-radius: 0;
          background: transparent;
          box-shadow: none;
          overflow: visible;
        }

        .row {
          grid-template-columns: minmax(0, 1fr) auto auto;
          row-gap: var(--space-100);
        }

        .price {
          grid-column: 1 / -1;
          flex-direction: row;
          justify-content: space-between;
        }
      }

      .demo {
        position: fixed;
        right: var(--space-200);
        bottom: var(--space-200);
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: var(--space-100);
        padding: var(--space-150);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-lg);
        background: var(--color-bg-surface);
        box-shadow: var(--shadow-md);
        font-size: var(--font-size-xs);
      }

      .toolbar[hidden],
      .demo[hidden] {
        display: none;
      }

      .demo fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-050);
        margin: 0;
        padding: 0;
        border: 0;
      }

      .demo legend {
        margin-bottom: var(--space-050);
        color: var(--color-text-secondary);
      }

      .demo label {
        padding: var(--space-050) var(--space-100);
        border: 1px solid var(--color-border-default);
        border-radius: var(--radius-pill);
        cursor: pointer;
      }

      .demo input {
        position: absolute;
        opacity: 0;
      }

      .demo label:has(input:checked) {
        border-color: var(--color-bg-accent);
        background: var(--color-bg-accent-subtle);
        color: var(--color-text-accent-strong);
      }

      .demo label:has(input:focus-visible) {
        outline: 2px solid var(--color-bg-accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body data-variant="a" data-state="all">
    <div class="shell">
      <nav class="sidebar" aria-label="主選單">
        <span>儀表板</span>
        <span>市場</span>
        <span aria-current="page">歷史紀錄</span>
        <span>買賣計畫</span>
        <span>新增</span>
        <span>搜尋</span>
      </nav>
      <main class="content">
        <div class="toolbar toolbar_outside"></div>
        <section class="list_card" aria-label="歷史紀錄">
          <div class="toolbar toolbar_inside"></div>
          <div class="list_scroll" id="list"></div>
        </section>
      </main>
    </div>

    <form class="demo" aria-label="設計稿切換">
      <fieldset>
        <legend>版本</legend>
        <label><input type="radio" name="variant" value="current" />現況</label>
        <label><input type="radio" name="variant" value="a" checked />A 併進清單頂端（推薦）</label>
        <label><input type="radio" name="variant" value="b" />B 清單上方靠右</label>
        <label><input type="radio" name="variant" value="c" />C 清單上方靠左、低調</label>
      </fieldset>
      <fieldset>
        <legend>狀態</legend>
        <label><input type="radio" name="state" value="all" checked />全部紀錄</label>
        <label><input type="radio" name="state" value="filtered" />搜尋「2330」</label>
        <label><input type="radio" name="state" value="none" />沒有符合</label>
      </fieldset>
    </form>

    <template id="search">
      <label class="search_field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M23.707,22.293l-5.969-5.969a10.016,10.016,0,1,0-1.414,1.414l5.969,5.969a1,1,0,0,0,1.414-1.414ZM10,18a8,8,0,1,1,8-8A8.009,8.009,0,0,1,10,18Z"
          />
        </svg>
        <input type="text" placeholder="輸入證券代號或名稱" aria-label="搜尋紀錄" />
        <button type="button" class="RoundButton_main clear" aria-label="清除搜尋" title="清除搜尋">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M23.707.293h0a1,1,0,0,0-1.414,0L12,10.586,1.707.293a1,1,0,0,0-1.414,0h0a1,1,0,0,0,0,1.414L10.586,12,.293,22.293a1,1,0,0,0,0,1.414h0a1,1,0,0,0,1.414,0L12,13.414,22.293,23.707a1,1,0,0,0,1.414,0h0a1,1,0,0,0,0-1.414L13.414,12,23.707,1.707A1,1,0,0,0,23.707.293Z"
            />
          </svg>
        </button>
      </label>
      <span class="count"></span>
    </template>

    <script>
      const records = [
        ["2330", "台積電", "2026-11-25", "buy", "買進", "1,000 股", "成交價", "1,066"],
        ["2303", "聯電", "2026-11-25", "sell", "賣出", "1,000 股", "成交價", "52.4"],
        ["1216", "統一", "2026-11-20", "dividend", "股利", "", "入帳金額", "1,110"],
        ["2330", "台積電", "2026-11-04", "buy", "買進", "104 股", "成交價", "1,166.88"],
        ["2886", "兆豐金", "2026-11-02", "buy", "買進", "226 股", "成交價", "44.32"],
        ["3008", "大立光", "2026-11-01", "sell", "賣出", "138 股", "成交價", "1,190.27"],
        ["2303", "聯電", "2026-10-31", "buy", "買進", "111 股", "成交價", "26.76"],
        ["2330", "台積電", "2026-10-30", "sell", "賣出", "12 股", "成交價", "1,111.95"],
        ["2886", "兆豐金", "2026-10-28", "buy", "買進", "169 股", "成交價", "42.3"],
        ["2330", "台積電", "2026-10-28", "buy", "買進", "273 股", "成交價", "1,086.82"],
        ["0050", "元大台灣50", "2026-10-21", "buy", "買進", "500 股", "成交價", "198.45"],
        ["2454", "聯發科", "2026-10-15", "buy", "買進", "40 股", "成交價", "1,520"],
        ["2317", "鴻海", "2026-10-09", "sell", "賣出", "300 股", "成交價", "216.5"],
        ["2330", "台積電", "2026-10-02", "buy", "買進", "50 股", "成交價", "1,045"],
      ];

      const body = document.body;
      const list = document.getElementById("list");
      const template = document.getElementById("search");

      function renderRows() {
        const state = body.dataset.state;
        const keyword = state === "all" ? "" : state === "filtered" ? "2330" : "2603";
        const rows = records.filter(([sid, name]) => !keyword || sid.includes(keyword) || name.includes(keyword));
        list.innerHTML = rows.length
          ? rows
              .map(
                ([sid, name, date, type, typeLabel, quantity, priceLabel, price]) => `
            <div class="row">
              <span class="identity">
                <span class="company"><span class="sid">${sid}</span><span>${name}</span></span>
                <span class="date">${date}</span>
              </span>
              <span class="badge ${type}">${typeLabel}</span>
              <span class="quantity">${quantity}</span>
              <span class="price"><small>${priceLabel}</small><strong>$${price}</strong></span>
            </div>`,
              )
              .join("")
          : `<div class="empty">目前沒有紀錄</div>`;
        document.querySelectorAll(".search_field input").forEach((input) => (input.value = keyword));
        document.querySelectorAll(".count").forEach((count) => (count.textContent = `${rows.length} 筆`));
      }

      function placeSearch() {
        document.querySelectorAll(".toolbar").forEach((toolbar) => (toolbar.innerHTML = ""));
        const narrow = matchMedia("(max-width: 959px)").matches;
        const inside = body.dataset.variant === "a" && !narrow;
        const target = document.querySelector(inside ? ".toolbar_inside" : ".toolbar_outside");
        target.append(template.content.cloneNode(true));
        document.querySelector(".toolbar_inside").hidden = !inside;
        document.querySelector(".toolbar_outside").hidden = inside;
        renderRows();
      }

      document.addEventListener("click", (event) => {
        const clear = event.target.closest(".clear");
        if (!clear) return;
        event.preventDefault();
        const input = clear.parentElement.querySelector("input");
        input.value = "";
        input.focus();
      });

      document.querySelector(".demo").addEventListener("change", (event) => {
        body.dataset[event.target.name] = event.target.value;
        placeSearch();
      });
      matchMedia("(max-width: 959px)").addEventListener("change", placeSearch);
      const params = new URLSearchParams(location.search);
      for (const key of ["variant", "state"]) {
        if (params.has(key)) {
          body.dataset[key] = params.get(key);
          const input = document.querySelector(`.demo input[name="${key}"][value="${params.get(key)}"]`);
          if (input) input.checked = true;
        }
      }
      if (params.has("nodemo")) document.querySelector(".demo").hidden = true;
      placeSearch();
    </script>
  </body>
</html>
