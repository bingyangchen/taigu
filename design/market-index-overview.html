<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>大盤指數｜Taigu 設計稿</title>
  <style>
    :root {
      --page: #f6f9fc;
      --white: #fff;
      --ink: #444;
      --blue: #4c8bf5;
      --focus: #2760b6;
      --muted: #58616a;
      --line: #ddd;
      --up: #af352e;
      --down: #087747;
      --sidebar: 230px;
      --navigation: 65px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu",
        "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body, h1, h2, p { margin: 0; }
    body { min-block-size: 100dvh; }
    a, button, select { color: inherit; font: inherit; }
    a { text-decoration: none; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    html { scroll-padding-block-end: calc(var(--navigation) + env(safe-area-inset-bottom)); }
    ::selection { background: #d1eeff; }
    .icon { width: 20px; height: 20px; fill: currentColor; flex: none; }
    .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-block-size: 100dvh; }
    .sidebar { position: sticky; top: 0; height: 100dvh; background: var(--white); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 0 5px 20px; }
    .account { display: flex; min-height: 72px; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); font-size: .875rem; }
    .account .icon { width: 30px; height: 30px; }
    .account > div { flex: 1; }
    .collapse { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; background: transparent; border: 0; border-radius: 8px; }
    .collapse:hover { background: var(--page); }
    .collapse .icon { width: 16px; height: 16px; }
    .shell.collapsed { --sidebar: 64px; }
    .collapsed .account { padding: 0; justify-content: center; }
    .collapsed .account > span, .collapsed .account > div, .collapsed .sidebar-brand, .collapsed .nav-label { display: none; }
    .collapsed .nav > * { justify-content: center; padding: 0; }
    .account small { display: block; color: var(--focus); margin-top: 5px; }
    .nav { display: grid; gap: 5px; margin-top: 5px; }
    .nav > * { display: flex; align-items: center; min-height: 65px; gap: 14px; padding: 0 20px; border-radius: 10px; font-size: .875rem; color: var(--muted); }
    .nav [aria-current] { color: var(--focus); background: #edf3fe; }
    .sidebar-brand { margin: auto auto 4px; }
    .brand img { display: block; width: 68px; height: auto; }
    .speed-dial, .mobile-header, .mobile-nav { display: none; }
    main { min-width: 0; padding: 30px; }
    .workspace { max-width: 1260px; margin-inline: auto; }
    .heading { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 1.625rem; font-weight: 700; line-height: 1.25; }
    .back { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 50%; }
    .back { position: relative; }
    .back:hover::after, .back:focus-visible::after { content: attr(aria-label); white-space: nowrap; position: absolute; z-index: 3; top: 100%; left: 0; border-radius: 6px; padding: 4px 8px; background: var(--ink); color: var(--white); font-size: .75rem; pointer-events: none; }
    .back:hover { background: #eaf2fc; }
    .back .icon { width: 16px; height: 16px; transform: rotate(180deg); }
    .surface { background: var(--white); border: 1px solid var(--line); border-radius: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
    .segmented { display: flex; align-items: center; padding: 2px; border-radius: 10px; background: var(--page); border: 1px solid var(--line); }
    .segmented button { min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; font-size: .875rem; font-weight: 600; }
    .segmented button:hover { background: #eaf2fc; }
    .segmented button[aria-pressed="true"] { color: var(--focus); background: #e8f0ff; }
    .quote-date { margin-left: auto; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .markets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .market { min-width: 0; padding: 22px; }
    .market + .market { border-left: 1px solid var(--line); }
    .market h2 { font-size: 1rem; font-weight: 650; line-height: 1.35; }
    .quote { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin: 7px 0 14px; font-variant-numeric: tabular-nums; }
    .value { font-size: clamp(1.625rem, 1.15rem + 1.4vw, 2.25rem); line-height: 1.1; font-weight: 690; letter-spacing: -.025em; }
    .change { font-size: 1rem; font-weight: 650; white-space: nowrap; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .chart-note { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; min-height: 18px; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .key { display: inline-flex; align-items: center; gap: 5px; }
    .key::before { content: ""; width: 13px; border-top: 1px dashed var(--muted); }
    .key[hidden] { display: none; }
    .plot { position: relative; height: clamp(180px, calc(100dvh - 350px), 340px); border-radius: 4px; }
    canvas { display: block; width: 100%; height: 100%; }
    .plot canvas { touch-action: pan-y; }
    .point { position: absolute; z-index: 1; box-shadow: 0 2px 10px #0002; background: var(--white); border-radius: 8px; padding: 7px 10px; color: var(--ink); font-size: .75rem; line-height: 1.5; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
    .point strong { display: block; }
    .plot-status { position: absolute; inset: 5px 0 26px; display: grid; align-content: center; justify-items: center; gap: 3px; color: var(--muted); text-align: center; font-size: .8125rem; background: var(--page); border-radius: 6px; padding: 8px; }
    .plot-status button { border: 0; background: transparent; color: var(--focus); min-height: 44px; padding-inline: 12px; font-weight: 600; }
    .skeleton { width: 54%; height: 8px; margin-bottom: 8px; border-radius: 4px; background: #d1eeff; }
    .demo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: .75rem; }
    .demo select { width: 125px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); padding: 0 5px; }
    .dashboard { min-block-size: 100dvh; background: linear-gradient(#d1eeff, #feedff); }
    .index-link { display: block; padding: 0 20px; background: #ffffffbd; }
    .index-link:hover { background: var(--white); border-color: var(--blue); }
    .index-link-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; border-bottom: 1px solid #0001; }
    .index-link-header strong { font-size: 1rem; }
    .index-link-header span { display: flex; gap: 6px; align-items: center; color: var(--focus); font-size: .875rem; }
    .index-link-header .icon { width: 12px; height: 12px; }
    .index-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .index-summary > div { display: grid; grid-template-columns: auto minmax(30px, 1fr) auto; align-items: center; gap: 12px; padding: 14px 16px 14px 0; }
    .index-summary > div + div { border-left: 1px solid #0001; padding-left: 16px; }
    .index-summary canvas { width: min(100%, 104px); height: 30px; justify-self: center; }
    .summary-value { text-align: right; font-variant-numeric: tabular-nums; }
    .summary-value strong { display: block; font-size: 1.125rem; }
    .summary-value .change { font-size: .75rem; }
    .summary-market-date { display: block; color: var(--muted); font-size: .75rem; }
    .summary-date { display: block; padding: 0 0 12px; font-size: .75rem; color: var(--muted); }
    .dashboard-context { margin-top: 24px; padding: 20px; background: #ffffffa0; }
    .dashboard-context h2 { font-size: 1rem; margin-bottom: 8px; }
    .dashboard-context p { font-size: 1.75rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    @media (960px <= width <= 1160px) {
      .quote { display: grid; min-height: 61px; }
    }
    @media (width < 960px) {
      .shell { display: block; position: relative; }
      .sidebar { display: none; }
      .mobile-header { display: flex; position: relative; align-items: center; justify-content: center; height: var(--navigation); background: var(--white); border-bottom: 1px solid var(--line); }
      .shell:has(#dashboard[hidden]) .mobile-header .brand { visibility: hidden; }
      .mobile-header .icon { position: absolute; right: 16px; top: calc(50% - 10px); }
      .mobile-nav { position: fixed; inset: auto 0 0; display: flex; align-items: center; min-height: var(--navigation); padding-bottom: env(safe-area-inset-bottom); background: var(--white); border-top: 1px solid var(--line); z-index: 2; }
      .speed-dial { display: block; position: fixed; z-index: 2; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); }
      .speed-dial summary { display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--white); cursor: pointer; margin-left: auto; }
      .speed-dial nav { position: absolute; bottom: 56px; right: 0; border-radius: 12px; box-shadow: 0 3px 12px #0003; background: var(--white); padding: 4px 12px; white-space: nowrap; }
      .speed-dial a { display: flex; align-items: center; min-height: 44px; }
      .speed-dial a:hover { color: var(--focus); }
      .mobile-nav > * { flex: 1; display: grid; place-items: center; align-content: center; gap: 4px; min-height: 50px; font-size: .6875rem; color: var(--muted); }
      .collapsed .mobile-nav .nav-label { display: inline; }
      .mobile-nav [aria-current] { color: var(--focus); }
      main { padding: 10px 16px calc(75px + env(safe-area-inset-bottom)); }
      .dashboard { min-block-size: calc(100dvh - var(--navigation)); }
      .heading { margin-bottom: 4px; }
      #indices .heading { position: absolute; inset: 0 60px auto; min-height: var(--navigation); justify-content: center; }
      #indices .back { position: absolute; left: -54px; margin-left: 0; }
      h1 { font-size: 1.375rem; }
      .surface:not(.index-link, .dashboard-context) { background: none; border: 0; border-radius: 0; }
      .toolbar { padding: 0 0 8px; gap: 6px 8px; }
      .segmented button { padding-inline: 8px; }
      .markets { grid-template-columns: minmax(0, 1fr); }
      .market { padding: 10px 0 7px; }
      .market + .market { border-left: 0; border-top: 1px solid var(--line); }
      .quote { margin: 3px 0 5px; }
      .market .change { font-size: .875rem; }
      .chart-note, .quote-date { font-size: .6875rem; }
      .plot { height: clamp(110px, calc((100dvh - 478px - env(safe-area-inset-bottom)) / 2), 210px); background: var(--white); }
      .point { top: auto !important; bottom: calc(100% + 1px); padding: 1px 5px; }
      .point strong { display: inline; margin-right: 4px; }
      .demo { margin-top: 3px; padding-right: 54px; }
      .index-summary { grid-template-columns: minmax(0, 1fr); }
      .index-summary > div { padding: 10px 0; }
      .index-summary > div + div { border-left: 0; padding-left: 0; border-top: 1px solid #0001; }
    }
    @media (max-width: 360px) {
      .quote-date { flex-basis: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="桌面導覽">
      <div class="account"><span data-icon="user"></span><div>林小姐<small>查看帳號與設定</small></div><button type="button" class="collapse" aria-label="收合側邊欄" title="收合側邊欄" aria-expanded="true"><span data-icon="sidebar"></span></button></div>
      <nav class="nav" data-nav></nav>
      <span class="brand sidebar-brand"><img src="/logo-l.png" alt="Taigu"></span>
    </aside>
    <header class="mobile-header">
      <span class="brand"><img src="/logo-l.png" alt="Taigu"></span>
    </header>
    <main id="main">
      <div class="workspace">
        <section id="dashboard" aria-labelledby="dashboard-title" hidden>
          <header class="heading"><h1 id="dashboard-title" tabindex="-1">儀表板</h1></header>
          <a href="#indices" class="surface index-link" aria-labelledby="summary-heading index-link-title">
            <div class="index-link-header"><strong id="summary-heading">大盤指數</strong><span id="index-link-title">查看走勢 <span data-icon="chevron"></span></span></div>
            <div class="index-summary"></div>
            <time class="summary-date" datetime="2026-11-24">行情日期 2026/11/24</time>
          </a>
          <section class="surface dashboard-context" aria-label="投入金額"><h2>投入金額</h2><p>$1,280,500</p></section>
        </section>
        <section id="indices" aria-labelledby="index-title">
          <header class="heading">
            <a href="#dashboard" class="back" aria-label="回儀表板"><span data-icon="chevron"></span></a>
            <h1 id="index-title" tabindex="-1">大盤指數</h1>
          </header>
          <div class="surface">
            <div class="toolbar">
              <div class="segmented" role="group" aria-label="兩個指數的走勢類型" id="modes">
                <button type="button" data-mode="intraday" aria-pressed="true">今日</button>
                <button type="button" data-mode="historical" aria-pressed="false">歷史</button>
              </div>
              <div class="segmented" role="group" aria-label="兩個指數的歷史區間" id="ranges" hidden>
                <button type="button" data-range="30" aria-label="最近 30 筆" aria-pressed="true">1M</button>
                <button type="button" data-range="91" aria-label="最近 91 筆" aria-pressed="false">1Q</button>
                <button type="button" data-range="365" aria-label="最近 365 筆" aria-pressed="false">1Y</button>
                <button type="button" data-range="all" aria-label="全部" aria-pressed="false">ALL</button>
              </div>
              <time class="quote-date" datetime="2026-11-24">行情日期 2026/11/24</time>
            </div>
            <div class="markets"></div>
          </div>
        </section>
        <div class="demo">
          <span>設計稿 · 模擬行情</span>
          <label id="demo-control">預覽狀態
            <select id="scenario">
              <option value="ready">一般行情</option>
              <option value="loading">櫃買載入中</option>
              <option value="empty">櫃買沒有資料</option>
              <option value="error">櫃買讀取失敗</option>
              <option value="shared-error">盤中行情讀取失敗</option>
              <option value="stale">櫃買保留舊走勢</option>
              <option value="closed">休市</option>
              <option value="different-dates">兩個指數行情日期不同</option>
              <option value="unknown-dates">行情日期不明</option>
              <option value="single">歷史只有一筆盤中資料</option>
            </select>
          </label>
        </div>
      </div>
    </main>
    <details class="speed-dial">
      <summary aria-label="新增或搜尋"><span data-icon="add"></span></summary>
      <nav aria-label="新增或搜尋">
        <a href="/records/trade/new">新增交易紀錄</a>
        <a href="/records/cash-dividend/new">新增現金股利</a>
        <a href="/plans/new">新增買賣計畫</a>
        <a href="/search">搜尋</a>
      </nav>
    </details>
    <nav class="mobile-nav" aria-label="手機導覽" data-nav></nav>
  </div>
  <template id="market-template">
    <section class="market">
      <h2></h2>
      <div class="quote"><p class="value"></p><p class="change"></p></div>
      <div class="chart-note"><span class="chart-context"></span><span class="key">昨收</span></div>
      <div class="plot">
        <canvas tabindex="0" aria-keyshortcuts="ArrowLeft ArrowRight Home End Escape"></canvas>
        <output class="point" hidden></output>
        <div class="plot-status" role="status" hidden><span class="skeleton" hidden></span><span class="message"></span><button type="button" hidden>重試</button></div>
      </div>
    </section>
  </template>

    function icon(name) {
      return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
    }
    document.querySelectorAll("[data-icon]").forEach(element => { element.innerHTML = icon(element.dataset.icon); });
    const sidebarToggle = document.querySelector(".collapse");
    sidebarToggle.addEventListener("click", () => {
      const collapsed = document.querySelector(".shell").classList.toggle("collapsed");
      const label = collapsed ? "展開側邊欄" : "收合側邊欄";
      sidebarToggle.setAttribute("aria-expanded", String(!collapsed));
      sidebarToggle.setAttribute("aria-label", label);
      sidebarToggle.title = label;
    });
    const navigation = [["home", "儀表板"], ["market", "市場"], ["history", "歷史紀錄"], ["plan", "買賣計畫"], ["add", "新增"], ["search", "搜尋"]];
    document.querySelectorAll("[data-nav]").forEach(nav => {
      nav.innerHTML = (nav.classList.contains("mobile-nav") ? [...navigation.slice(0, 4), ["user", "帳號"]] : navigation).map(([name, label]) =>
        name === "home" ? `<a href="#dashboard" aria-current="location" aria-label="${label}">${icon(name)}<span class="nav-label">${label}</span></a>` :
          `<span aria-disabled="true" aria-label="${label}">${icon(name)}<span class="nav-label">${label}</span></span>`
      ).join("");
    });

    function getChange(price, close) {
      const delta = price - close;
      const className = delta >= .005 ? "up" : delta <= -.005 ? "down" : "";
      const symbol = className === "up" ? "▲" : className === "down" ? "▼" : "";
      return { className, text: `${symbol}${formatNumber.format(Math.abs(delta))}（${Math.abs(delta / close * 100).toFixed(2)}%）` };
    }

    function getClock(minute) {
      return `${String(9 + Math.floor(minute / 60)).padStart(2, "0")}:${String(minute % 60).padStart(2, "0")}`;
    }

    function hasQuoteDate(index) {
      return !["unknown-dates", "shared-error"].includes(scenario.value)
        && !(scenario.value === "empty" && index.market === "otc");
    }

    function needsIndividualQuoteDates() {
      return ["different-dates", "empty", "unknown-dates"].includes(scenario.value);
    }

    function getQuoteDay(index) {
      return scenario.value === "closed" || (scenario.value === "different-dates" && index.market === "otc") ? 23 : 24;
    }

    function getIntraday(index) {
      const end = getQuoteDay(index) === 23 ? 270 : 160;
      return Array.from({ length: end + 1 }, (_, minute) => {
        const position = minute / end * (index.anchors.length - 1);
        const anchor = Math.floor(position);
        const fraction = position - anchor;
        const value = index.anchors[anchor] + ((index.anchors[anchor + 1] ?? index.latest) - index.anchors[anchor]) * fraction;
        const variation = Math.sin(fraction * Math.PI) * (Math.sin(minute * 1.9) + .5 * Math.cos(minute * 3.1));
        return { position: minute / 270, label: getClock(minute), price: value + (index.market === "tse" ? 8 : .09) * variation };
      });
    }

    function getHistorical(index) {
      const dates = [];
      const date = new Date(`2026-11-${getQuoteDay(index)}T00:00:00Z`);
      const hasDatedQuote = hasQuoteDate(index);
      if (!hasDatedQuote) date.setUTCDate(date.getUTCDate() - 1);
      while (dates.length < 560) {
        if (date.getUTCDay() % 6) dates.unshift(new Date(date));
        date.setUTCDate(date.getUTCDate() - 1);
      }
      const visibleDates = dates.slice(-(range === "all" ? dates.length : range));
      if (scenario.value === "single" && index.market === "otc") return [{ position: 1, label: fullDate.format(visibleDates.at(-1)), tick: dateLabel.format(visibleDates.at(-1)), price: index.latest }];
      return visibleDates.map((date, offset) => {
        const distance = visibleDates.length - 1 - offset + (hasDatedQuote ? 0 : 1);
        const ratio = index.market === "tse"
          ? Math.sin(distance / 3.7) * .008 + Math.sin(distance / 12) * .017 - (1 - Math.exp(-distance / 160)) * .18
          : Math.sin(distance / 6.1) * .012 + Math.sin(distance / 25) * .045 - (1 - Math.exp(-distance / 118)) * .21;
        const direction = index.market === "tse" ? 1 : .58;
        return { position: offset / (visibleDates.length - 1), label: fullDate.format(date), tick: range === "all" || range === 365 ? historicalDateLabel.format(date).replaceAll("-", "/") : dateLabel.format(date), price: index.latest * (1 + direction * ratio) };
      });
    }

    function prepareCanvas(canvas) {
      const { width, height } = canvas.getBoundingClientRect();
      if (!width || !height) return null;
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const context = canvas.getContext("2d");
      context.scale(scale, scale);
      return { context, width, height };
    }

    function drawChart(panel) {
      const { canvas, index } = panel;
      const dimensions = prepareCanvas(canvas);
      if (!dimensions) return;
      const { context, width, height } = dimensions;
      const left = 12, right = width - 49, top = 12, bottom = height - 25;
      const data = panel.data;
      const intraday = mode === "intraday";
      const values = data.map(point => point.price);
      if (intraday) values.push(index.close);
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const step = Math.max((maximum - minimum) / 3, maximum * .0001);
      const magnitude = 10 ** Math.floor(Math.log10(step));
      const tick = ([1, 2, 2.5, 5, 10].find(value => value * magnitude >= step) ?? 10) * magnitude;
      const lower = Math.floor(minimum / tick) * tick;
      const upper = Math.ceil(maximum / tick) * tick;
      const x = point => left + (right - left) * point.position;
      const y = price => bottom - (bottom - top) * (price - lower) / (upper - lower);
      panel.bounds = { left, right, top, bottom };
      context.font = "11px system-ui";
      context.textBaseline = "middle";
      context.textAlign = "right";
      context.fillStyle = "#58616a";
      for (let price = lower; price <= upper + tick / 100; price += tick) {
        const position = y(price);
        context.fillText(formatNumber.format(price), width - 5, position);
        context.strokeStyle = "#e4e8ec";
        context.beginPath();
        context.moveTo(left, position);
        context.lineTo(right, position);
        context.stroke();
      }
      const ticks = intraday
        ? [[0, "09:00"], [1 / 3, "10:30"], [2 / 3, "12:00"], [1, "13:30"]]
        : (data.length === 1 ? [1] : [0, .33, .66, 1]).map(position => [position, data[Math.round(position * (data.length - 1))].tick]);
      ticks.forEach(([position, label]) => {
        context.textAlign = position === 0 ? "left" : position === 1 ? "right" : "center";
        context.fillText(label, x({ position }), bottom + 14);
      });
      if (intraday) {
        context.strokeStyle = "#58616a";
        context.setLineDash([4, 3]);
        context.beginPath();
        context.moveTo(left, y(index.close));
        context.lineTo(right, y(index.close));
        context.stroke();
        context.setLineDash([]);
      }
      context.beginPath();
      data.forEach((point, offset) => {
        if (!offset) context.moveTo(x(point), y(point.price));
        else context.lineTo(x(point), y(point.price));
      });
      context.strokeStyle = "#2760b6";
      context.lineWidth = 1.75;
      context.stroke();
      const last = data.at(-1);
      const point = panel.active === null ? last : data[panel.active];
      if (panel.active !== null) {
        context.beginPath();
        context.moveTo(x(point), top);
        context.lineTo(x(point), bottom);
        context.strokeStyle = "#58616a";
        context.lineWidth = 1;
        context.stroke();
        const delta = intraday ? getChange(point.price, index.close).text : "";
        panel.output.innerHTML = `<strong>${point.label} · ${formatNumber.format(point.price)}</strong>${delta}`;
        panel.output.hidden = false;
        const position = x(point);
        const tooltipWidth = panel.output.offsetWidth;
        panel.output.style.left = `${Math.max(0, position + 10 + tooltipWidth <= width ? position + 10 : position - tooltipWidth - 10)}px`;
        panel.output.style.top = "4px";
      } else {
        panel.output.hidden = true;
      }
      context.fillStyle = "#2760b6";
      context.beginPath();
      context.arc(x(point), y(point.price), 3, 0, 2 * Math.PI);
      context.fill();
    }

    function drawSummary(canvas, index) {
      const dimensions = prepareCanvas(canvas);
      if (!dimensions) return;
      const { width, height, context } = dimensions;
      const values = index.anchors;
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      context.beginPath();
      values.forEach((price, offset) => {
        const x = 2 + offset * (width - 4) / (values.length - 1);
        const y = height - 3 - (height - 6) * (price - minimum) / (maximum - minimum);
        if (!offset) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.strokeStyle = "#2760b6";
      context.lineWidth = 1.5;
      context.stroke();
    }

    const panels = indexData.map(index => {
      const element = document.querySelector("#market-template").content.firstElementChild.cloneNode(true);
      const heading = element.querySelector("h2");
      heading.id = `${index.market}-title`;
      heading.textContent = index.name;
      element.setAttribute("aria-labelledby", heading.id);
      markets.append(element);
      const canvas = element.querySelector("canvas");
      const output = element.querySelector("output");
      const status = element.querySelector(".plot-status");
      const panel = { index, canvas, output, status, element, active: null };
      const summary = document.createElement("div");
      const change = getChange(index.latest, index.close);
      summary.innerHTML = `<span>${index.name}<time class="summary-market-date" hidden></time></span><canvas aria-hidden="true"></canvas>
        <span class="summary-value"><strong>${formatNumber.format(index.latest)}</strong>
        <span class="change ${change.className}">${change.text}</span></span>`;
      document.querySelector(".index-summary").append(summary);
      const summaryCanvas = summary.querySelector("canvas");
      panel.summary = summary;
      const observer = new ResizeObserver(() => {
        if (panel.data && !canvas.hidden) drawChart(panel);
        drawSummary(summaryCanvas, index);
      });
      observer.observe(canvas.parentElement);
      observer.observe(summaryCanvas);

      function selectPoint(event) {
        if (!panel.bounds || (event.pointerType === "touch" && event.type === "pointermove" && !event.buttons)) return;
        const { left, right, top, bottom } = panel.bounds;
        const rectangle = canvas.getBoundingClientRect();
        const x = event.clientX - rectangle.left;
        const y = event.clientY - rectangle.top;
        if (x < left || x > right || y < top || y > bottom) {
          if (panel.active !== null) clearPoint();
          return;
        }
        const position = (x - left) / (right - left);
        panel.active = panel.data.reduce((best, point, offset) =>
          Math.abs(point.position - position) < Math.abs(panel.data[best].position - position) ? offset : best, 0);
        drawChart(panel);
      }

      function clearPoint() {
        panel.active = null;
        drawChart(panel);
      }

      canvas.addEventListener("pointerdown", selectPoint);
      canvas.addEventListener("pointermove", selectPoint);
      canvas.addEventListener("pointerleave", event => { if (event.pointerType === "mouse") clearPoint(); });
      canvas.addEventListener("blur", clearPoint);
      canvas.addEventListener("keydown", event => {
        const last = panel.data.length - 1;
        const previous = panel.active ?? last;
        const positions = { ArrowLeft: previous - 1, ArrowRight: previous + 1, Home: 0, End: last };
        if (event.key === "Escape") { clearPoint(); return; }
        if (!(event.key in positions)) return;
        event.preventDefault();
        panel.active = Math.max(0, Math.min(last, positions[event.key]));
        drawChart(panel);
      });
      status.querySelector("button").addEventListener("click", () => {
        scenario.value = "ready";
        render();
        canvas.focus();
      });
      return panel;
    });

    function render() {
      const intraday = mode === "intraday";
      const closed = scenario.value === "closed";
      const showIndividualDates = needsIndividualQuoteDates();
      const sharedError = intraday && scenario.value === "shared-error";
      quoteDate.hidden = showIndividualDates || scenario.value === "shared-error";
      quoteDate.textContent = closed ? "最近交易日 2026/11/23" : "行情日期 2026/11/24";
      quoteDate.dateTime = `2026-11-${closed ? "23" : "24"}`;
      historyRanges.hidden = intraday;
      document.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", button.dataset.mode === mode));
      document.querySelectorAll("[data-range]").forEach(button => button.setAttribute("aria-pressed", button.dataset.range === String(range)));
      panels.forEach(panel => {
        const { index, element, canvas, output, status } = panel;
        const hasQuote = scenario.value !== "shared-error";
        const state = sharedError ? "error" : !intraday && index.market === "otc" ? scenario.value : "ready";
        const affected = ["loading", "empty", "error"].includes(state);
        const stale = state === "stale";
        const tradingDate = getQuoteDay(index);
        const change = getChange(index.latest, index.close);
        element.querySelector(".value").textContent = hasQuote ? formatNumber.format(index.latest) : "--";
        element.querySelector(".change").textContent = hasQuote ? change.text : "";
        element.querySelector(".change").className = `change ${change.className}`;
        element.querySelector(".key").hidden = !intraday || affected;
        const chartContext = element.querySelector(".chart-context");
        const quoteTime = getClock(tradingDate === 23 ? 270 : 160);
        const date = showIndividualDates ? (hasQuoteDate(index) ? `2026/11/${tradingDate}` : "行情日期不明") : "";
        const statusText = stale ? "更新失敗，顯示上次取得的走勢" : intraday && !affected ? `行情至 ${quoteTime}` : "";
        chartContext.textContent = [date, statusText].filter(Boolean).join(" · ");
        status.hidden = !affected;
        status.querySelector(".skeleton").hidden = state !== "loading";
        status.querySelector(".message").textContent = {
          loading: "正在讀取走勢",
          empty: intraday ? "目前沒有盤中走勢" : "目前沒有歷史走勢",
          error: sharedError ? "暫時無法讀取盤中行情" : "暫時無法讀取走勢"
        }[state] ?? "";
        status.querySelector("button").hidden = state !== "error" || (sharedError && index.market === "otc");
        canvas.hidden = affected;
        canvas.setAttribute("aria-label", `${index.name}${intraday ? "盤中" : "歷史"}走勢（點）。使用左右方向鍵查閱，Esc 清除選點。`);
        output.hidden = true;
        panel.active = null;
        panel.data = intraday ? getIntraday(index) : getHistorical(index);
        if (!affected) drawChart(panel);
      });
    }

    document.querySelectorAll("[data-mode]").forEach(button => {
      button.addEventListener("click", () => { mode = button.dataset.mode; render(); });
    });
    document.querySelectorAll("[data-range]").forEach(button => {
      button.addEventListener("click", () => { range = button.dataset.range === "all" ? "all" : Number(button.dataset.range); render(); });
    });
    scenario.addEventListener("change", render);

    function renderRoute(focusHeading) {
      const showDashboard = location.hash === "#dashboard";
      document.querySelector(".speed-dial").open = false;
      dashboard.hidden = !showDashboard;
      details.hidden = showDashboard;
      document.querySelector("#main").classList.toggle("dashboard", showDashboard);
      document.querySelector("#demo-control").hidden = showDashboard;
      if (showDashboard) {
        const showIndividualDates = needsIndividualQuoteDates();
        const summaryDate = document.querySelector(".summary-date");
        summaryDate.hidden = showIndividualDates || scenario.value === "shared-error";
        const day = getQuoteDay(indexData[0]);
        summaryDate.textContent = `行情日期 2026/11/${day}`;
        summaryDate.dateTime = `2026-11-${day}`;
        panels.forEach(({ index, summary }) => {
          const hasQuote = scenario.value !== "shared-error";
          const marketDay = getQuoteDay(index);
          const time = summary.querySelector(".summary-market-date");
          time.textContent = hasQuoteDate(index) ? `2026/11/${marketDay}` : "行情日期不明";
          time.dateTime = hasQuoteDate(index) ? `2026-11-${marketDay}` : "";
          time.hidden = !hasQuote || !showIndividualDates;
          summary.querySelector("canvas").style.visibility = hasQuote ? "" : "hidden";
          summary.querySelector("strong").textContent = hasQuote ? formatNumber.format(index.latest) : "--";
          summary.querySelector(".change").hidden = !hasQuote;
        });
      } else {
        mode = "intraday";
        render();
      }
      if (focusHeading) document.querySelector(showDashboard ? ".index-link" : "#index-title").focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    window.addEventListener("hashchange", () => renderRoute(true));
    renderRoute(false);
  </script>
</body>
</html>
